name: CI and Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'backend[dev]'
      - run: pytest backend/tests
      - run: ruff check backend
      - run: mypy --strict backend/tailorcore backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
  android:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run android:sync
        working-directory: frontend
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
        working-directory: frontend/android
      - run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk tailorcore-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tailorcore-debug-apk
          path: tailorcore-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/8a59c2e5-tfest' && github.repository == 'EXDDRT/Tfest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tailorcore-preview >/dev/null 2>&1; then
            gh release upload tailorcore-preview tailorcore-debug.apk --clobber
          else
            gh release create tailorcore-preview tailorcore-debug.apk --target "$GITHUB_SHA" --title "TailorCore preview" --notes "Debug-signed experimental build. Do not enter real customer data." --prerelease
          fi
