[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tailorcore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.8", "uvicorn==0.34.0", "sqlalchemy==2.0.38"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1", "mypy==1.15.0", "ruff==0.9.7"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
